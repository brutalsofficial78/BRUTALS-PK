<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRUTALS-PK — PFP Maker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;background:#050509;color:#fff;
    font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;
}
body:before{
    content:"";position:fixed;width:500px;height:500px;left:-180px;top:-180px;
    background:rgba(168,85,247,.16);filter:blur(100px);border-radius:50%;
    pointer-events:none
}
.nav{
    height:72px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;
    background:rgba(5,5,9,.78);backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(168,85,247,.15);position:sticky;top:0;z-index:5
}
.brand{display:flex;align-items:center;gap:11px;color:white;text-decoration:none;font-weight:800}
.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 15px rgba(168,85,247,.5)}
.back{color:#bbb;text-decoration:none;font-size:13px;padding:9px 14px;border:1px solid #25212d;border-radius:10px}
.back:hover{border-color:#a855f7;color:#fff}
.main{max-width:1200px;margin:auto;padding:55px 7% 80px}
.heading{text-align:center;margin-bottom:35px}
.heading small{color:#a855f7;letter-spacing:4px;font-weight:bold}
.heading h1{font-size:clamp(34px,6vw,58px);margin:9px 0}
.heading p{color:#888;font-size:14px}
.editor{
    display:grid;grid-template-columns:340px 1fr;gap:28px;align-items:start
}
.controls,.preview-box{
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
    border-radius:22px;padding:25px
}
.controls h2,.preview-box h2{font-size:18px;margin-bottom:20px}
.group{margin-bottom:19px}
label{display:block;color:#aaa;font-size:12px;margin-bottom:8px}
input[type=file],input[type=text],select{
    width:100%;padding:11px;border-radius:10px;border:1px solid #292332;
    background:#0d0b12;color:#fff;outline:none
}
input[type=color]{width:100%;height:42px;border:0;background:none;cursor:pointer}
input[type=range]{width:100%;accent-color:#a855f7}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos-value{color:#a855f7;font-size:11px;text-align:right;margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
    width:100%;padding:12px;border:0;border-radius:11px;cursor:pointer;
    color:#fff;font-weight:800;background:linear-gradient(135deg,#9333ea,#6d28d9);
    margin-top:5px;transition:.25s
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(124,58,237,.3)}
.preview-wrap{
    min-height:500px;display:flex;align-items:center;justify-content:center;
    border-radius:18px;background:
    radial-gradient(circle at center,rgba(168,85,247,.13),transparent 55%),#08070c;
    overflow:hidden
}
canvas{
    width:min(430px,90%);height:auto;aspect-ratio:1/1;border-radius:50%;
    box-shadow:0 0 45px rgba(168,85,247,.18);background:#15111c
}
.hint{color:#777;font-size:11px;text-align:center;margin-top:12px}
@media(max-width:850px){.editor{grid-template-columns:1fr}.preview-wrap{min-height:auto;padding:25px}}
</style>
</head>
<body>

<nav class="nav">
    <a href="index.html" class="brand">
        <img src="logo.png" alt="BRUTALS-PK">
        BRUTALS-PK
    </a>
    <a href="index.html" class="back">← Home</a>
</nav>

<main class="main">
    <div class="heading">
        <small>BRUTALS-PK</small>
        <h1>🎨 PFP Maker</h1>
        <p>Upload your photo and create your own gaming profile picture.</p>
    </div>

    <div class="editor">
        <section class="controls">
            <h2>Customize</h2>

            <div class="group">
                <label>YOUR PHOTO</label>
                <input id="photo" type="file" accept="image/*">
            </div>

            <div class="group">
                <label>NAME / TEXT</label>
                <input id="name" type="text" placeholder="Enter your name">
            </div>

            <div class="group">
                <label>FONT</label>
                <select id="font">
                    <option value="900 42px Arial">Bold</option>
                    <option value="900 42px Impact">Impact</option>
                    <option value="900 42px Georgia">Classic</option>
                    <option value="bold 42px Verdana">Gaming</option>
                </select>
            </div>

            <div class="group">
                <label>BACKGROUND</label>
                <input id="bg" type="color" value="#12051f">
            </div>

            <div class="group">
                <label>TEXT COLOR</label>
                <input id="textColor" type="color" value="#ffffff">
            </div>

            <div class="group">
                <label>TEXT POSITION — MOVE LEFT / RIGHT</label>
                <input id="textX" type="range" min="-180" max="180" value="0">
                <div class="pos-value" id="textXValue">0</div>
            </div>

            <div class="group">
                <label>TEXT POSITION — MOVE UP / DOWN</label>
                <input id="textY" type="range" min="-180" max="180" value="105">
                <div class="pos-value" id="textYValue">105</div>
            </div>

            <div class="group">
                <label>TEXT SIZE</label>
                <input id="textSize" type="range" min="18" max="90" value="42">
                <div class="pos-value" id="textSizeValue">42 px</div>
            </div>

            <div class="group">
                <label>NEON GLOW</label>
                <input id="glow" type="range" min="0" max="35" value="18">
            </div>

            <div class="group">
                <label>PHOTO ZOOM</label>
                <input id="zoom" type="range" min="80" max="160" value="110">
            </div>

            <div class="row">
                <button class="btn" id="reset">RESET</button>
                <button class="btn" id="download">DOWNLOAD</button>
            </div>
        </section>

        <section class="preview-box">
            <h2>Live Preview</h2>
            <div class="preview-wrap">
                <canvas id="canvas" width="700" height="700"></canvas>
            </div>
            <div class="hint">Your photo stays in your browser while you edit.</div>
        </section>
    </div>
</main>

<script>
const photo = document.getElementById('photo');
const nameInput = document.getElementById('name');
const fontSelect = document.getElementById('font');
const bg = document.getElementById('bg');
const textColor = document.getElementById('textColor');
const textX = document.getElementById('textX');
const textY = document.getElementById('textY');
const textSize = document.getElementById('textSize');
const glow = document.getElementById('glow');
const zoom = document.getElementById('zoom');
const reset = document.getElementById('reset');
const download = document.getElementById('download');

const textXValue = document.getElementById('textXValue');
const textYValue = document.getElementById('textYValue');
const textSizeValue = document.getElementById('textSizeValue');

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let img = null;

function updateLabels(){
    textXValue.textContent = textX.value;
    textYValue.textContent = textY.value;
    textSizeValue.textContent = textSize.value + ' px';
}

function draw(){
    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = bg.value;
    ctx.fillRect(0,0,W,H);

    // Decorative background glow.
    const grd = ctx.createRadialGradient(W/2,H/2,30,W/2,H/2,W/2);
    grd.addColorStop(0,'rgba(168,85,247,.25)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,W,H);

    if(img){
        const base = Math.max(W/img.width,H/img.height);
        const scale = base * (Number(zoom.value)/100);
        const dw = img.width * scale;
        const dh = img.height * scale;

        ctx.save();
        ctx.beginPath();
        ctx.arc(W/2,H/2,W/2-10,0,Math.PI*2);
        ctx.clip();

        ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
        ctx.restore();
    }

    // Circle border.
    ctx.save();
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#a855f7';
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = Number(glow.value);
    ctx.beginPath();
    ctx.arc(W/2,H/2,W/2-10,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();

    // User text with independent X/Y positioning.
    const text = nameInput.value.trim();
    if(text){
        let fontString = fontSelect.value;
        const family = fontString.substring(fontString.lastIndexOf('px') + 3).trim();
        ctx.font = '900 ' + textSize.value + 'px ' + family;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const x = W/2 + Number(textX.value);
        const y = H/2 + Number(textY.value);

        ctx.save();
        ctx.fillStyle = textColor.value;
        ctx.shadowColor = textColor.value;
        ctx.shadowBlur = Number(glow.value);
        ctx.fillText(text,x,y);
        ctx.restore();
    }

    updateLabels();
}

photo.addEventListener('change',e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
        img = new Image();
        img.onload = draw;
        img.src = reader.result;
    };
    reader.readAsDataURL(file);
});

[nameInput,fontSelect,bg,textColor,textX,textY,textSize,glow,zoom].forEach(el=>{
    el.addEventListener('input',draw);
    el.addEventListener('change',draw);
});

reset.addEventListener('click',()=>{
    photo.value = '';
    nameInput.value = '';
    fontSelect.value = '900 42px Arial';
    bg.value = '#12051f';
    textColor.value = '#ffffff';
    textX.value = 0;
    textY.value = 105;
    textSize.value = 42;
    glow.value = 18;
    zoom.value = 110;
    img = null;
    draw();
});

download.addEventListener('click',()=>{
    const a = document.createElement('a');
    a.download = 'BRUTALS-PK-PFP.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
});

draw();
</script>
</body>
</html>
