<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRUTALS-PK — Crosshair Maker</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 20% 20%,rgba(130,50,255,.22),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(80,20,180,.20),transparent 30%),
        #07050d;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(120deg,transparent 0%,rgba(255,255,255,.025) 50%,transparent 100%);
    animation:bgMove 8s linear infinite;
}

@keyframes bgMove{
    0%{transform:translateX(-30%);}
    100%{transform:translateX(30%);}
}

.container{
    width:min(1150px,92%);
    margin:auto;
    padding:35px 0 60px;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:30px;
}

.brand{
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
}

.back{
    text-decoration:none;
    color:#fff;
    padding:11px 18px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;
    background:rgba(255,255,255,.05);
    transition:.25s;
}

.back:hover{
    transform:translateY(-2px);
    border-color:#9b5cff;
    box-shadow:0 0 25px rgba(155,92,255,.25);
}

.hero{
    text-align:center;
    margin-bottom:35px;
}

.hero h1{
    font-size:clamp(38px,6vw,72px);
    font-weight:1000;
    letter-spacing:-2px;
    background:linear-gradient(90deg,#fff,#b987ff,#fff);
    background-size:200% auto;
    -webkit-background-clip:text;
    color:transparent;
    animation:titleShine 4s linear infinite;
}

@keyframes titleShine{
    to{background-position:200% center;}
}

.hero p{
    margin-top:10px;
    color:#aaa;
    font-size:15px;
}

.mode{
    text-align:center;
    font-size:18px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:18px;
    color:#c99aff;
}

.editor{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:22px;
}

.panel,
.preview{
    border:1px solid rgba(255,255,255,.10);
    background:rgba(15,10,25,.78);
    backdrop-filter:blur(18px);
    border-radius:24px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.4),
        inset 0 1px rgba(255,255,255,.05);
}

.panel{
    padding:22px;
}

.panel h2{
    font-size:19px;
    margin-bottom:20px;
}

.group{
    margin-bottom:19px;
}

.group label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:#bbb;
    margin-bottom:9px;
}

.value{
    color:#c88cff;
    font-weight:bold;
}

select,
input[type="range"]{
    width:100%;
}

select{
    background:#100b19;
    color:#fff;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    padding:11px;
    outline:none;
}

input[type="range"]{
    accent-color:#9b5cff;
    cursor:pointer;
}

input[type="color"]{
    width:100%;
    height:44px;
    border:none;
    padding:3px;
    border-radius:11px;
    background:#100b19;
    cursor:pointer;
}

.presets{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.preset{
    padding:10px 8px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:10px;
    background:rgba(255,255,255,.045);
    color:#fff;
    cursor:pointer;
    transition:.25s;
}

.preset:hover{
    border-color:#a363ff;
    transform:translateY(-2px);
    box-shadow:0 0 18px rgba(163,99,255,.2);
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:12px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#7135c9,#a25cff);
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(130,65,220,.35);
}

.btn.reset{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
}

.preview{
    min-height:570px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.preview::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:45px 45px;
    mask-image:linear-gradient(to bottom,transparent,#000,transparent);
}

.preview-title{
    position:absolute;
    top:20px;
    left:22px;
    color:#777;
    font-size:12px;
    letter-spacing:1px;
}

.crosshair{
    position:relative;
    width:180px;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    filter:drop-shadow(0 0 8px currentColor);
    transition:.15s;
}

.crosshair .line{
    position:absolute;
    background:currentColor;
    border-radius:5px;
}

.crosshair .top{
    width:var(--thickness);
    height:var(--size);
    transform:translateY(calc(-1 * var(--gap)));
}

.crosshair .bottom{
    width:var(--thickness);
    height:var(--size);
    transform:translateY(var(--gap));
}

.crosshair .left{
    height:var(--thickness);
    width:var(--size);
    transform:translateX(calc(-1 * var(--gap)));
}

.crosshair .right{
    height:var(--thickness);
    width:var(--size);
    transform:translateX(var(--gap));
}

.crosshair .dot{
    width:var(--dot-size);
    height:var(--dot-size);
    border-radius:50%;
    background:currentColor;
    position:absolute;
}

.crosshair .ring{
    position:absolute;
    width:var(--ring-size);
    height:var(--ring-size);
    border:var(--thickness) solid currentColor;
    border-radius:50%;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#666;
    font-size:12px;
}

@media(max-width:850px){
    .editor{
        grid-template-columns:1fr;
    }

    .preview{
        min-height:430px;
    }
}

@media(max-width:500px){
    .container{
        width:94%;
        padding-top:22px;
    }

    .topbar{
        margin-bottom:20px;
    }

    .hero h1{
        font-size:42px;
    }

    .panel{
        padding:17px;
    }

    .preview{
        min-height:350px;
    }

    .crosshair{
        transform:scale(.82);
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <div class="brand">BRUTALS-PK</div>
        <a href="index.html" class="back">← Back</a>
    </div>

    <div class="hero">
        <h1>Crosshair Maker</h1>
        <p>Create your own custom gaming crosshair</p>
    </div>

    <div class="mode">EDITING MODE</div>

    <div class="editor">

        <div class="panel">

            <h2>Crosshair Settings</h2>

            <div class="group">
                <label>
                    <span>Type</span>
                </label>

                <select id="type">
                    <option value="cross">Cross</option>
                    <option value="dot">Dot</option>
                    <option value="ring">Ring</option>
                    <option value="crossdot">Cross + Dot</option>
                </select>
            </div>

            <div class="group">
                <label>
                    <span>Color</span>
                </label>

                <input type="color" id="color" value="#b45cff">
            </div>

            <div class="group">
                <label>
                    <span>Size</span>
                    <span class="value" id="sizeValue">30</span>
                </label>

                <input type="range" id="size" min="5" max="80" value="30">
            </div>

            <div class="group">
                <label>
                    <span>Thickness</span>
                    <span class="value" id="thicknessValue">5</span>
                </label>

                <input type="range" id="thickness" min="1" max="15" value="5">
            </div>

            <div class="group">
                <label>
                    <span>Gap</span>
                    <span class="value" id="gapValue">10</span>
                </label>

                <input type="range" id="gap" min="0" max="45" value="10">
            </div>

            <div class="group">
                <label>
                    <span>Center Dot</span>
                    <span class="value" id="dotValue">5</span>
                </label>

                <input type="range" id="dotSize" min="1" max="20" value="5">
            </div>

            <div class="group">
                <label>
                    <span>Ring Size</span>
                    <span class="value" id="ringValue">60</span>
                </label>

                <input type="range" id="ringSize" min="20" max="140" value="60">
            </div>

            <div class="group">
                <label>
                    <span>Presets</span>
                </label>

                <div class="presets">
                    <button class="preset" data-preset="purple">Purple Pro</button>
                    <button class="preset" data-preset="white">Clean White</button>
                    <button class="preset" data-preset="neon">Neon</button>
                    <button class="preset" data-preset="dot">Dot</button>
                </div>
            </div>

            <div class="buttons">
                <button class="btn reset" id="reset">Reset</button>
                <button class="btn" id="download">Download PNG</button>
            </div>

        </div>

        <div class="preview">

            <div class="preview-title">
                LIVE PREVIEW
            </div>

            <div
                class="crosshair"
                id="crosshair"
                style="
                    --size:30px;
                    --thickness:5px;
                    --gap:10px;
                    --dot-size:5px;
                    --ring-size:60px;
                    color:#b45cff;
                "
            >

                <div class="line top"></div>
                <div class="line bottom"></div>
                <div class="line left"></div>
                <div class="line right"></div>

                <div class="dot"></div>
                <div class="ring"></div>

            </div>

        </div>

    </div>

    <div class="footer">
        © 2026 BRUTALS-PK • Crosshair Maker
    </div>

</div>

<script>
const crosshair = document.getElementById("crosshair");

const type = document.getElementById("type");
const color = document.getElementById("color");
const size = document.getElementById("size");
const thickness = document.getElementById("thickness");
const gap = document.getElementById("gap");
const dotSize = document.getElementById("dotSize");
const ringSize = document.getElementById("ringSize");

const sizeValue = document.getElementById("sizeValue");
const thicknessValue = document.getElementById("thicknessValue");
const gapValue = document.getElementById("gapValue");
const dotValue = document.getElementById("dotValue");
const ringValue = document.getElementById("ringValue");

function updateCrosshair(){

    crosshair.style.setProperty("--size", size.value + "px");
    crosshair.style.setProperty("--thickness", thickness.value + "px");
    crosshair.style.setProperty("--gap", gap.value + "px");
    crosshair.style.setProperty("--dot-size", dotSize.value + "px");
    crosshair.style.setProperty("--ring-size", ringSize.value + "px");

    crosshair.style.color = color.value;

    sizeValue.textContent = size.value;
    thicknessValue.textContent = thickness.value;
    gapValue.textContent = gap.value;
    dotValue.textContent = dotSize.value;
    ringValue.textContent = ringSize.value;

    const t = type.value;

    document.querySelectorAll(".line").forEach(el=>{
        el.style.display =
            (t === "cross" || t === "crossdot")
            ? "block"
            : "none";
    });

    document.querySelector(".dot").style.display =
        (t === "dot" || t === "crossdot")
        ? "block"
        : "none";

    document.querySelector(".ring").style.display =
        t === "ring"
        ? "block"
        : "none";
}

[
    type,
    color,
    size,
    thickness,
    gap,
    dotSize,
    ringSize
].forEach(el=>{
    el.addEventListener("input",updateCrosshair);
    el.addEventListener("change",updateCrosshair);
});


document.querySelectorAll(".preset").forEach(button=>{

    button.addEventListener("click",()=>{

        const preset = button.dataset.preset;

        if(preset === "purple"){
            type.value = "cross";
            color.value = "#b45cff";
            size.value = 30;
            thickness.value = 5;
            gap.value = 10;
            dotSize.value = 5;
            ringSize.value = 60;
        }

        if(preset === "white"){
            type.value = "cross";
            color.value = "#ffffff";
            size.value = 25;
            thickness.value = 4;
            gap.value = 8;
            dotSize.value = 4;
            ringSize.value = 60;
        }

        if(preset === "neon"){
            type.value = "crossdot";
            color.value = "#00ffcc";
            size.value = 28;
            thickness.value = 4;
            gap.value = 9;
            dotSize.value = 5;
            ringSize.value = 65;
        }

        if(preset === "dot"){
            type.value = "dot";
            color.value = "#ff4dff";
            size.value = 20;
            thickness.value = 5;
            gap.value = 10;
            dotSize.value = 7;
            ringSize.value = 60;
        }

        updateCrosshair();
    });

});


document.getElementById("reset").addEventListener("click",()=>{

    type.value = "cross";
    color.value = "#b45cff";
    size.value = 30;
    thickness.value = 5;
    gap.value = 10;
    dotSize.value = 5;
    ringSize.value = 60;

    updateCrosshair();
});


document.getElementById("download").addEventListener("click",()=>{

    const canvas = document.createElement("canvas");

    canvas.width = 500;
    canvas.height = 500;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(0,0,500,500);

    const cx = 250;
    const cy = 250;

    const s = Number(size.value);
    const th = Number(thickness.value);
    const g = Number(gap.value);
    const ds = Number(dotSize.value);
    const rs = Number(ringSize.value);

    ctx.fillStyle = color.value;
    ctx.strokeStyle = color.value;

    ctx.shadowColor = color.value;
    ctx.shadowBlur = 8;

    const selected = type.value;

    if(selected === "cross" || selected === "crossdot"){

        ctx.fillRect(
            cx - th/2,
            cy - g - s,
            th,
            s
        );

        ctx.fillRect(
            cx - th/2,
            cy + g,
            th,
            s
        );

        ctx.fillRect(
            cx - g - s,
            cy - th/2,
            s,
            th
        );

        ctx.fillRect(
            cx + g,
            cy - th/2,
            s,
            th
        );
    }

    if(selected === "dot" || selected === "crossdot"){

        ctx.beginPath();
        ctx.arc(cx,cy,ds/2,0,Math.PI*2);
        ctx.fill();
    }

    if(selected === "ring"){

        ctx.lineWidth = th;

        ctx.beginPath();
        ctx.arc(cx,cy,rs/2,0,Math.PI*2);
        ctx.stroke();
    }

    const link = document.createElement("a");

    link.download = "BRUTALS-PK-Crosshair.png";
    link.href = canvas.toDataURL("image/png");

    link.click();
});

updateCrosshair();
</script>

</body>
</html>
